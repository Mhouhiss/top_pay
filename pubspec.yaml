name: top_pay
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.3.0

  # Networking
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0

  # Fonts
  google_fonts: ^8.1.0

  # Icons
  iconsax: ^0.0.8

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_messaging: ^16.2.0

  # OTP Input
  pinput: ^3.0.1

  # Device features
  image_picker: ^1.2.2
  sms_autofill: ^2.5.0

  # Utilities
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  path_provider: ^2.1.5
  timeago: ^3.7.1
  connectivity_plus: ^7.1.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App Icon Asset Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/tp_splash_logo.png"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/gifs/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700